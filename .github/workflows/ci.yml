# Runs lint, build and tests on every push and pull request.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The repo is checked out with CRLF on Windows and ESLint enforces
      # linebreak-style "windows", so check out with CRLF here too.
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
