# Publishes @jaivalsaija/react-rough-notation to npm when a version tag is pushed
# (e.g. `npm version minor && git push --follow-tags`).
# Uses npm trusted publishing (OIDC), so no npm token secret is needed. The
# trusted publisher must be configured on npmjs.com for this workflow file.
# See https://docs.npmjs.com/trusted-publishers

name: NPM Package Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm publish
